# Updates the pinned action SHAs in .github/workflows.
# A new release must be 7 days old before Dependabot proposes it.
# Python dependencies: the monthly CI run audits them (pip-audit).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The base image of the dev container (pinned by digest). The other pinned
  # tools (PowerShell, Pester, Azure CLI) are ARGs in the Dockerfile.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The container's Python matches the Function App runtime (3.12, install.ps1).
    # Digest updates of 3.12 still come. A new Python version is one change:
    # install.ps1, the Dockerfile, CI, and the docs together.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
