# Publish a GitHub release when function/version.py has a new version.
# A commit to main that raises VERSION runs the full CI, then tags the commit
# "v<VERSION>" and creates a release with generated notes. Installed monitors
# read the latest release once a day and show "Update available" (they never
# install code themselves). A version that already has a release is skipped.
# The release has a source archive. In a public repository, the archive also
# gets a signed build provenance attestation (gh attestation verify). Private
# repositories need GitHub Enterprise Cloud for attestations.
# No Azure credentials.

name: Release

on:
  push:
    branches: [main]
    paths: [function/version.py]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Tag and publish
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the attestation (public repository only)
      attestations: write # store the attestation (public repository only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version
        id: version
        run: |
          version=$(python3 -c 'import sys; sys.path.insert(0, "function"); from version import VERSION; print(VERSION)')
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::function/version.py: VERSION must be MAJOR.MINOR.PATCH, not '$version'"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists. Nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the source archive
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git archive --format=tar.gz --prefix="m365-ato-monitor-$TAG/" -o "m365-ato-monitor-$TAG.tar.gz" "$GITHUB_SHA"
      - name: Attest the archive
        if: steps.existing.outputs.exists != 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: m365-ato-monitor-${{ steps.version.outputs.tag }}.tar.gz
      - name: Publish the release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes "m365-ato-monitor-$TAG.tar.gz"
