# Monthly check of EXCHANGE_SERVER_NETS (function/mail_access.py): the
# Exchange Online server prefixes that the session and mail access checks
# ignore. The run fails if Microsoft publishes a prefix as Azure (customer)
# or Office 365 client address space. A failed scheduled run emails the
# repository owners. No Azure credentials; the token is read-only.

name: Exchange server prefixes

on:
  # Not on pull requests: the check downloads Microsoft's lists, and a failed
  # download must not fail an unrelated change. Before you add a prefix, run
  # scripts/check_exchange_nets.py, or start this workflow by hand.
  schedule:
    - cron: "41 6 3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check against Microsoft IP lists
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the prefixes
        run: python scripts/check_exchange_nets.py
