# OpenSSF Scorecard: checks the repository's security practices (pinned
# actions, token permissions, branch protection, and others) and publishes the
# score for the README badge. Scorecard publishes results only for public
# repositories, so the job runs only when the repository is public.
# No Azure credentials.

name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      id-token: write # publish the results (signed with the workflow identity)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
